<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Selenga — Web Messenger</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Selenga</h1>
    <nav>
      <a href="admin.html">Админ-панель</a>
    </nav>
  </header>

  <main>
    <section id="auth">
      <div id="user-info" class="hidden">
        <span id="display-name"></span>
        <button id="logout">Выйти</button>
      </div>

      <div id="forms">
        <form id="login-form">
          <h2>Вход</h2>
          <input id="login-email" type="email" placeholder="Email" required />
          <input id="login-password" type="password" placeholder="Пароль" required />
          <button type="submit">Войти</button>
          <p>Нет аккаунта? <a href="#" id="show-register">Зарегистрироваться</a></p>
        </form>

        <form id="register-form" class="hidden">
          <h2>Регистрация</h2>
          <input id="reg-username" type="text" placeholder="Логин (например, Lentini)" required />
          <input id="reg-email" type="email" placeholder="Email" required />
          <input id="reg-password" type="password" placeholder="Пароль" required />
          <button type="submit">Зарегистрироваться</button>
          <p>Есть аккаунт? <a href="#" id="show-login">Войти</a></p>
        </form>
      </div>
    </section>

    <section id="chat" class="hidden">
      <div id="messages" aria-live="polite"></div>
      <form id="message-form">
        <input id="message-input" type="text" placeholder="Введите сообщение" autocomplete="off" required />
        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
